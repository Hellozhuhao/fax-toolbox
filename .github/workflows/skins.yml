name: Skin contracts and Windows build
on:
  pull_request:
  push:
    branches: [main, feat/skin-system]
permissions:
  contents: read
jobs:
  contracts-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate:skins
      - run: npx playwright install --with-deps chromium
      - run: npm run test:skins:ui
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/skins/SkinStore.Tests.csproj -- .
      - run: dotnet build apps/windows-shell/Toolbox.Windows.csproj --nologo
