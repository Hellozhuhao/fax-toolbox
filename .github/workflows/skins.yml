name: Skin contracts and Windows build
on:
  pull_request:
  push:
    branches: [main, feat/skin-system]
permissions:
  contents: read
jobs:
  contracts-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate:skins
      - run: npx playwright install --with-deps chromium
      - run: npm run test:skins:ui
      - run: npm run test:ui
  windows:
    runs-on: windows-latest
    env:
      PUBLIC_VISUAL_REVIEW: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[visual-review]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/skins/SkinStore.Tests.csproj -- .
      - run: dotnet build apps/windows-shell/Toolbox.Windows.csproj --nologo
      - name: Exercise and capture native UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.cache/ui-native' -Force | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          & dotnet run --project tests/ui-native/UiSystem.Tests.csproj 2>&1 | Tee-Object -FilePath '.cache/ui-native-run.log'
          $result = $LASTEXITCODE
          $log = Get-Content '.cache/ui-native-run.log' -Raw
          $body = "Native UI execution · commit $env:GITHUB_SHA · exit $result`n`n" + '```text' + "`n$log`n" + '```'
          $body >> $env:GITHUB_STEP_SUMMARY
          exit $result
        env:
          FAX_NATIVE_SCREENSHOTS: .cache/ui-native
      - name: Render installer states
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.cache/ui-native' -Force | Out-Null
          foreach ($state in @('welcome', 'progress', 'complete', 'error')) {
            dotnet run --project apps/windows-installer/Toolbox.Installer.csproj -- --preview ".cache/ui-native/installer-$state.png" $state
            if ($LASTEXITCODE -ne 0) { throw "Installer preview failed: $state" }
          }
      - name: Prepare public native visual review
        if: always()
        shell: pwsh
        run: |
          # These images contain only test fixtures, with no accounts, credentials or live device content.
          $capture = Join-Path $PWD '.cache/ui-native'
          $review = Join-Path $capture 'review'
          New-Item -ItemType Directory -Path $review -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          foreach ($file in Get-ChildItem $capture -Filter 'installer-*.png') {
            $image = [System.Drawing.Image]::FromFile($file.FullName)
            try { $image.Save((Join-Path $review ($file.BaseName + '.jpg')), [System.Drawing.Imaging.ImageFormat]::Jpeg) }
            finally { $image.Dispose() }
          }
          $images = @(Get-ChildItem $review -Filter '*.jpg')
          if ($images.Count -eq 0) { throw 'No native UI review images were generated' }
          $manifest = Join-Path $review 'review-manifest.json'
          @{ commit = $env:GITHUB_SHA; images = @($images.Name); synthetic = $true } | ConvertTo-Json -Depth 4 | Set-Content $manifest
          $archive = Join-Path $PWD '.cache/native-visual-review.zip'
          Compress-Archive -Path @($images.FullName + $manifest) -DestinationPath $archive -Force
          $data = [Convert]::ToBase64String([IO.File]::ReadAllBytes($archive))
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          # Explicit review runs publish only synthetic screenshots as public notices.
          # Normal runs retain the usual artifact and private job summaries.
          if ($env:PUBLIC_VISUAL_REVIEW -eq 'true') {
            $noticeSize = 48000
            $noticeParts = [int][Math]::Ceiling($data.Length / [double]$noticeSize)
            if ($noticeParts -gt 40) { throw 'Public visual review exceeds the annotation limit' }
            for ($part = 0; $part -lt $noticeParts; $part++) {
              $chunk = $data.Substring($part * $noticeSize, [Math]::Min($noticeSize, $data.Length - $part * $noticeSize))
              $group = [int][Math]::Floor($part / 10) + 1
              $notice = "::notice title=Native visual review $($part + 1)/$noticeParts::FAX_NATIVE_ZIP_V1|$($part + 1)|$noticeParts|$hash|$env:GITHUB_SHA|$chunk"
              Add-Content -Path (Join-Path $PWD ".cache/native-notices-$group.txt") -Value $notice
            }
          }
          $chunkSize = 600000
          $parts = [int][Math]::Ceiling($data.Length / [double]$chunkSize)
          if ($parts -gt 4) { throw 'Native review exceeds the public summary limit; use the lossless artifact' }
          for ($part = 0; $part -lt $parts; $part++) {
            $chunk = $data.Substring($part * $chunkSize, [Math]::Min($chunkSize, $data.Length - $part * $chunkSize))
            $body = "Native visual review · commit $env:GITHUB_SHA`n`nSHA256: $hash`n`nFAX_NATIVE_REVIEW_V1_PART_$($part + 1)_OF_$parts`n`n" + '```text' + "`n$chunk`n" + '```' + "`n"
            Set-Content -Path (Join-Path $PWD ".cache/native-review-$($part + 1).md") -Value $body
          }
      - name: Native visual review 1
        if: always()
        shell: pwsh
        run: |
          if (Test-Path '.cache/native-review-1.md') { Get-Content '.cache/native-review-1.md' -Raw >> $env:GITHUB_STEP_SUMMARY }
          if (Test-Path '.cache/native-notices-1.txt') { Get-Content '.cache/native-notices-1.txt' | ForEach-Object { Write-Host $_ } }
      - name: Native visual review 2
        if: always()
        shell: pwsh
        run: |
          if (Test-Path '.cache/native-review-2.md') { Get-Content '.cache/native-review-2.md' -Raw >> $env:GITHUB_STEP_SUMMARY }
          if (Test-Path '.cache/native-notices-2.txt') { Get-Content '.cache/native-notices-2.txt' | ForEach-Object { Write-Host $_ } }
      - name: Native visual review 3
        if: always()
        shell: pwsh
        run: |
          if (Test-Path '.cache/native-review-3.md') { Get-Content '.cache/native-review-3.md' -Raw >> $env:GITHUB_STEP_SUMMARY }
          if (Test-Path '.cache/native-notices-3.txt') { Get-Content '.cache/native-notices-3.txt' | ForEach-Object { Write-Host $_ } }
      - name: Native visual review 4
        if: always()
        shell: pwsh
        run: |
          if (Test-Path '.cache/native-review-4.md') { Get-Content '.cache/native-review-4.md' -Raw >> $env:GITHUB_STEP_SUMMARY }
          if (Test-Path '.cache/native-notices-4.txt') { Get-Content '.cache/native-notices-4.txt' | ForEach-Object { Write-Host $_ } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-review
          path: .cache/ui-native

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Activate Rust toolchain
        shell: pwsh
        run: rustup default stable
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $locations = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = @($locations | ForEach-Object { Get-ChildItem -Path (Join-Path $_ '*\msedgewebview2.exe') -ErrorAction SilentlyContinue })
          if ($runtime.Count -gt 0) { Write-Host 'WebView2 Runtime is installed'; exit 0 }
          New-Item -ItemType Directory -Path '.cache' -Force | Out-Null
          $installer = Join-Path $PWD '.cache/MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'WebView2 installer signature verification failed' }
          $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "WebView2 Runtime installation failed: $($process.ExitCode)" }
      - name: Run full Windows development validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.cache' -Force | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Test 2>&1 | Tee-Object -FilePath '.cache/windows-validation.log'
          $result = $LASTEXITCODE
          $log = (Get-Content '.cache/windows-validation.log' -Tail 100) -join "`n"
          ("Windows full validation · commit $env:GITHUB_SHA · exit $result`n`n" + '```text' + "`n$log`n" + '```') >> $env:GITHUB_STEP_SUMMARY
          if ($result -ne 0) {
            $detail = $log.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows validation failed::$detail"
          }
          exit $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            .cache/windows-validation.log
            .cache/windows-*.txt*
